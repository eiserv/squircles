<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>squircles with React</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f3f5fa;
        color: #192d73;
        font: 15px/1.5 system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: min(880px, calc(100% - 48px));
        margin: 40px auto;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 24px;
        letter-spacing: -0.01em;
      }

      h2 {
        margin: 0 0 14px;
        font-size: 15px;
      }

      header p {
        margin: 0;
        max-width: 62ch;
        color: #52607f;
      }

      section {
        margin-top: 36px;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        align-items: flex-start;
      }

      .stack {
        display: grid;
        gap: 16px;
        justify-items: start;
      }

      .note {
        margin: 12px 0 0;
        font-size: 13px;
        color: #52607f;
      }

      /*
        Nothing below is squircle-specific except --squircle-smoothing.
        The components are given no paint props at all.
      */

      .button {
        display: inline-grid;
        place-items: center;
        min-height: 48px;
        padding: 12px 20px;
        background: #192d73;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        --squircle-smoothing: 1;
        font: inherit;
        font-weight: 600;
        color: white;
        text-decoration: none;
        cursor: pointer;
        transition: background-color 150ms ease;
      }

      .button:hover {
        background: #14245e;
      }

      .button:focus-visible {
        outline: 2px solid #192d73;
        outline-offset: 4px;
      }

      .button--ghost {
        background: transparent;
        border-color: #192d73;
        color: #192d73;
      }

      .button--ghost:hover {
        background: #e2e7f5;
      }

      .card {
        display: block;
        width: 280px;
        background: white;
        border: 1px solid #dce1ed;
        border-radius: 20px;
        --squircle-smoothing: 1;
        box-shadow: 0 12px 32px rgba(25, 45, 115, 0.18);
      }

      .card__image {
        display: block;
        width: 100%;
        height: 130px;
        object-fit: cover;
        border-radius: 14px;
        --squircle-smoothing: 1;
      }

      .card__body {
        display: grid;
        gap: 4px;
        padding: 14px 16px;
        font-size: 13px;
      }

      .card__body span {
        color: #52607f;
      }

      .input {
        width: 220px;
        padding: 10px 12px;
        background: white;
        border: 1px solid #b9c2d8;
        border-radius: 10px;
        --squircle-smoothing: 1;
        font: inherit;
        color: #192d73;
      }

      .badge {
        display: inline-block;
        padding: 6px 14px;
        background: #edaa2b;
        border-radius: 999px;
        --squircle-smoothing: 1;
        font-size: 12px;
        font-weight: 600;
        color: #192d73;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
