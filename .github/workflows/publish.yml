name: Publish to npm

# Publishing is driven by GitHub Releases: creating a release for tag v0.2.0
# publishes 0.2.0. The tag and package.json must agree, which the job checks
# before it touches the registry.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and pack, but do not publish"
        type: boolean
        default: true

permissions:
  contents: read
  # Required for npm provenance and for trusted publishing.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm 11.5.1+ is needed for trusted publishing.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Verify the tag matches package.json
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm run check

      - name: Publish
        if: github.event_name == 'release'
        run: npm publish --provenance --access public
        env:
          # Ignored once trusted publishing is configured on npmjs.com; keep it
          # until then, because the very first publish cannot use OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
