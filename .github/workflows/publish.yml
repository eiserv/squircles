name: Veröffentlichung

# Jeder Push auf main aktualisiert die Versions-PR von release-please.
# Ihr Merge aktualisiert Version und Änderungsverlauf, erstellt Tag und
# GitHub-Veröffentlichung und veröffentlicht anschließend das npm-Paket.
# Manuell veröffentlichte Releases starten ebenfalls die Veröffentlichung.
# Mit GITHUB_TOKEN erstellte Releases lösen kein weiteres release-Ereignis aus.
# Dateinamen beibehalten: Die vertrauenswürdige npm-Veröffentlichung ist daran gebunden.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Erstellen und packen, ohne Veröffentlichung"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # Auch bei Release- und manuellen Ereignissen ohne release-please ausführen.
    if: >-
      !cancelled() && (
        needs.release-please.outputs.release_created == 'true' ||
        github.event_name == 'release' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Für npm-Herkunftsnachweise und die vertrauenswürdige Veröffentlichung nötig.
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Die vertrauenswürdige Veröffentlichung benötigt npm ab 11.5.1.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Tag mit package.json abgleichen
        if: github.event_name != 'workflow_dispatch'
        env:
          TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${TAG#v}" != "$version" ]; then
            echo "Tag $TAG stimmt nicht mit Paketversion $version überein" >&2
            exit 1
          fi

      - run: npm run check

      - name: Veröffentlichen
        if: github.event_name != 'workflow_dispatch' || !inputs.dry-run
        run: npm publish --provenance --access public
        env:
          # Wird nach Einrichtung der vertrauenswürdigen Veröffentlichung auf npmjs.com ignoriert.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
