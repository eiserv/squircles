name: Release

# Every push to main updates a release PR maintained by release-please. Merging
# that PR bumps package.json, writes CHANGELOG.md, tags vX.Y.Z, creates the
# GitHub Release, and publishes the package below.
#
# A release published by hand also publishes. Releases that release-please
# creates with GITHUB_TOKEN do not trigger the `release` event, so nothing is
# published twice.
#
# Keep this file name: npm trusted publishing is bound to it.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and pack, but do not publish"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # release-please is skipped for release and dispatch events; run anyway.
    if: >-
      !cancelled() && (
        needs.release-please.outputs.release_created == 'true' ||
        github.event_name == 'release' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance and for trusted publishing.
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm 11.5.1+ is needed for trusted publishing.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Verify the tag matches package.json
        if: github.event_name != 'workflow_dispatch'
        env:
          TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${TAG#v}" != "$version" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm run check

      - name: Publish
        if: github.event_name != 'workflow_dispatch' || !inputs.dry-run
        run: npm publish --provenance --access public
        env:
          # Ignored once trusted publishing is configured on npmjs.com.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
